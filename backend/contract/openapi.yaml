                    studentId:
                      type: string
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/GradeItem"
                    percentage:
                      type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{id}/gradebook/me:
    get:
      operationId: gradebook_me
      tags:
        - gradebook
      summary: Student's own grades with percentage (enrolled student)
      security:
        - bearerAuth: []
      x-story-ids:
        - STORY-013
      x-models:
        - Submission
        - QuizAttempt
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Own items and percentage
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - percentage
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GradeItem"
                  percentage:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /rooms/{id}/result:
    get:
      operationId: result_get
      tags:
        - results
      summary: Term result (teacher/admin see draft+published; students published only)
      security:
        - bearerAuth: []
      x-story-ids:
        - STORY-014
      x-models:
        - TermResult
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Term result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: result_publish
      tags:
        - results
      summary: Preview/publish/edit the term result (owning teacher)
      security:
        - bearerAuth: []
      x-story-ids:
        - STORY-014
      x-models:
        - TermResult
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:
                  type: string
                publish:
                  type: boolean
      responses:
        "200":
          description: Saved/published result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          description: Term closed; results locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications:
    get:
      operationId: notifications_list
