      security:
        - bearerAuth: []
      x-story-ids:
        - STORY-015
      x-models:
        - Notification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: New unread count
          content:
            application/json:
              schema:
                type: object
                required:
                  - unreadCount
                properties:
                  unreadCount:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    RoomId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    AnnouncementId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssignmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    QuizId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid credentials or missing token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate or already-exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    Role:
      type: string
      enum:
        - admin
        - teacher
        - student
    UserStatus:
      type: string
      enum:
        - active
        - pending
        - deactivated
    AttendanceStatus:
      type: string
      enum:
        - present
        - absent
        - late
    QuizAttemptStatus:
      type: string
      enum:
        - in_progress
        - submitted
    NotificationType:
      type: string
      enum:
        - assignmentPosted
        - quizPosted
        - announcementPosted
        - resultPublished
        - assignmentGraded
        - quizScored
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - status
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        enrollmentYear:
          type: integer
        setPasswordTokenExpiresAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        enrollmentYear:
          type: integer
    Room:
      type: object
      required:
        - id
        - name
        - status
        - ownerTeacherId
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - deactivated
        ownerTeacherId:
          type: string
        termCloseDate:
          type: string
          format: date
    RoomUpdate:
      type: object
      properties:
        name:
          type: string
        ownerTeacherId:
          type: string
        status:
          type: string
          enum:
            - active
            - deactivated
        termCloseDate:
          type:
            - string
            - "null"
          format: date
    Enrollment:
      type: object
      required:
        - id
        - roomId
        - studentId
        - enrolledAt
      properties:
        id:
          type: string
        roomId:
          type: string
        studentId:
          type: string
        enrolledAt:
          type: string
          format: date-time
        removedAt:
          type:
            - string
            - "null"
          format: date-time
        student:
          $ref: "#/components/schemas/User"
    AttendanceRecord:
      type: object
      required:
        - id
        - roomId
        - date
        - entries
      properties:
        id:
          type: string
        roomId:
          type: string
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceEntry"
    AttendanceEntry:
      type: object
      required:
        - id
        - studentId
        - status
      properties:
        id:
          type: string
        attendanceRecordId:
          type: string
        studentId:
          type: string
        status:
          $ref: "#/components/schemas/AttendanceStatus"
    Announcement:
      type: object
      required:
        - id
        - roomId
        - authorId
        - title
        - body
        - createdAt
      properties:
        id:
          type: string
        roomId:
          type: string
        authorId:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    Assignment:
      type: object
      required:
        - id
        - roomId
        - title
        - instructions
        - dueAt
        - totalPoints
      properties:
        id:
          type: string
        roomId:
          type: string
        title:
          type: string
        instructions:
          type: string
        dueAt:
          type: string
          format: date-time
        totalPoints:
          type: number
    Submission:
      type: object
      required:
        - id
        - assignmentId
        - studentId
        - fileUrl
        - submittedAt
        - isLate
      properties:
        id:
          type: string
        assignmentId:
          type: string
        studentId:
          type: string
        fileUrl:
          type: string
        submittedAt:
          type: string
          format: date-time
        isLate:
          type: boolean
        gradePoints:
          type:
            - number
            - "null"
        gradeComment:
          type:
            - string
            - "null"
        gradedAt:
          type:
            - string
            - "null"
          format: date-time
    Quiz:
      type: object
      required:
        - id
        - roomId
        - title
        - closesAt
      properties:
        id:
          type: string
        roomId:
          type: string
        title:
          type: string
        opensAt:
          type:
            - string
            - "null"
          format: date-time
        closesAt:
          type: string
          format: date-time
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
    QuizUpdate:
      type: object
      properties:
        title:
          type: string
        opensAt:
          type:
            - string
            - "null"
          format: date-time
        closesAt:
          type: string
          format: date-time
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestionInput"
    QuizQuestion:
      type: object
      required:
        - id
        - prompt
        - points
        - options
      properties:
        id:
          type: string
        prompt:
          type: string
        points:
          type: number
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuizOption"
    QuizQuestionInput:
      type: object
      required:
        - prompt
        - points
        - options
      properties:
        prompt:
          type: string
        points:
          type: number
          exclusiveMinimum: 0
        options:
          type: array
          items:
            type: object
            required:
              - text
              - isCorrect
            properties:
              text:
                type: string
              isCorrect:
                type: boolean
    QuizOption:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
        text:
          type: string
    QuizAttemptView:
      type: object
      required:
        - quiz
      properties:
        quiz:
          $ref: "#/components/schemas/Quiz"
        attempt:
          type: object
          properties:
            status:
              $ref: "#/components/schemas/QuizAttemptStatus"
            answers:
              type: array
              items:
                type: object
                properties:
                  questionId:
                    type: string
                  optionId:
                    type: string
            score:
              type:
                - number
                - "null"
            submittedAt:
              type:
                - string
                - "null"
              format: date-time
            perQuestion:
              type: array
              items:
                $ref: "#/components/schemas/PerQuestionResult"
    PerQuestionResult:
      type: object
      required:
        - questionId
        - chosenOptionId
        - correctOptionId
        - isCorrect
      properties:
        questionId:
          type: string
        chosenOptionId:
          type:
            - string
            - "null"
        correctOptionId:
          type: string
        isCorrect:
          type: boolean
    GradeItem:
      type: object
      required:
        - type
        - itemId
        - points
        - total
      properties:
        type:
          type: string
          enum:
            - assignment
            - quiz
        itemId:
          type: string
        points:
          type: number
        total:
          type: number
        comment:
          type:
            - string
            - "null"
    TermResult:
      type: object
      required:
        - id
        - roomId
        - term
        - summary
      properties:
        id:
          type: string
        roomId:
          type: string
        term:
          type: string
        summary:
          type: object
          additionalProperties: true
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        lockedAt:
          type:
            - string
            - "null"
          format: date-time
    Notification:
      type: object
      required:
        - id
        - type
        - message
        - createdAt
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        message:
          type: string
        link:
          type:
            - string
            - "null"
        readAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time